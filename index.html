
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102B4C">
  <meta name="description" content="L'avessi saputo — bacheca digitale dei manifesti funebri in Valle d'Aosta. Scarica l'app su App Store e Google Play.">
  <title>L'avessi saputo - Scarica l'app</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f7f4eb;
      color: #102B4C;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
      text-align: center;
    }

    main {
      width: 100%;
      max-width: 420px;
    }

    .bell {
      font-size: 64px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 36px;
      line-height: 1.05;
      margin: 8px 0;
      font-weight: 850;
    }

    .gold {
      color: #BD922D;
      font-weight: 700;
    }

    p {
      font-size: 18px;
      line-height: 1.5;
    }

    .button {
      display: block;
      padding: 16px;
      margin: 14px 0;
      border-radius: 12px;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
    }

    .apple {
      background: #102B4C;
      color: white;
    }

    .android {
      background: #E8BD52;
      color: #102B4C;
    }

    .note {
      font-size: 14px;
      color: #555;
    }
  </style>
</head>

<body>
  <main>
    <div class="bell">🔔</div>

    <h1>L'AVESSI<br>SAPUTO</h1>
    <p class="gold">Restare vicini è un gesto che vale.</p>

    <p id="message">
      La bacheca digitale dei manifesti funebri
      in Valle d'Aosta.
    </p>

    <a class="button apple"
       id="appleButton"
       href="https://apps.apple.com/it/app/lavessi-saputo/id6807952890">
       Scarica su App Store
    </a>

    <a class="button android"
       id="androidButton"
       href="https://play.google.com/store/apps/details?id=com.diego.lavessisaputo">
      ▶ Scarica su Google Play
    </a>

    <p class="note" id="note">
      Disponibile su App Store e Google Play.
    </p>

    <p class="note" style="margin-top: 28px;">
      <a href="privacy-policy.html" style="color:#102B4C;">Privacy Policy</a>
      ·
      <a href="Termini_d_uso.html" style="color:#102B4C;">Termini d'uso</a>
    </p>
  </main>

  <script>
    const appleUrl =
      "https://apps.apple.com/it/app/lavessi-saputo/id6807952890";
    const androidUrl =
      "https://play.google.com/store/apps/details?id=com.diego.lavessisaputo";

    const ua = navigator.userAgent || "";
    const isAndroid = /Android/i.test(ua);
    const isApple = /iPhone|iPad|iPod/i.test(ua);

    const note = document.getElementById("note");

    // Da QR / mobile: vai diretto allo store corretto.
    if (isApple) {
      window.location.replace(appleUrl);
    } else if (isAndroid) {
      window.location.replace(androidUrl);
    } else {
      note.textContent =
        "Scegli il tuo store, oppure apri il link dal telefono.";
    }
  </script>
</body>
</html>
